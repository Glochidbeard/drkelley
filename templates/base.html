<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dr. Kelley{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page">
  <div class="masthead">
    <h1>Dr. Kelley</h1>
    <div class="tagline">Treatment plans</div>
  </div>

  <div class="navbar">
    [ <a href="{{ url_for('index') }}">Treatment Plans</a> ]
    [ <a href="{{ url_for('pharmacy') }}">Chemicals &amp; REIs</a> ]
    [ <a href="{{ url_for('export_plans') }}">Download Plans CSV</a> ]
    [ <a href="{{ url_for('export_templates') }}">Download Templates CSV</a> ]
  </div>

  {% with msgs = get_flashed_messages() %}
    {% if msgs %}<div class="flash">{% for m in msgs %}<div>{{ m }}</div>{% endfor %}</div>{% endif %}
  {% endwith %}

  {% block body %}{% endblock %}
</div>
</body>
</html>
